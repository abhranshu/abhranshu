<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Abhranshu Akash — Data Science and AI</title>
  <desc id="desc">A light technical hero banner for Abhranshu Akash.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="75" r="120" fill="#4f46e5" opacity=".10">
    <animate attributeName="r" values="110;135;110" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".06;.14;.06" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="285" r="150" fill="#06b6d4" opacity=".08">
    <animate attributeName="r" values="140;165;140" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".04;.10;.04" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".18" stroke="#64748b">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360"/>
  </g>

  <rect x="70" y="62" width="7" height="220" rx="3.5" fill="url(#accent)">
    <animate attributeName="opacity" values=".55;1;.55" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="0" cy="0" r="4" fill="#0284c7">
    <animateMotion path="M70 70 L1140 70 L1140 300 L70 300 Z" dur="12s" repeatCount="indefinite"/>
  </circle>

  <text x="112" y="118" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="5">DATA SCIENCE · AI · ENGINEERING</text>
  <text x="112" y="181" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">ABHRANSHU AKASH</text>
  <text x="114" y="225" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Building intelligent systems from data → model → product.</text>

  <g transform="translate(114 265)">
    <rect width="112" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="56" y="25" text-anchor="middle" fill="#0369a1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">PYTHON</text>
    <rect x="126" width="96" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="174" y="25" text-anchor="middle" fill="#4338ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">AI / ML</text>
    <rect x="236" width="90" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="281" y="25" text-anchor="middle" fill="#6d28d9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">AWS</text>
    <rect x="340" width="112" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="396" y="25" text-anchor="middle" fill="#0e7490" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">FULL-STACK</text>
  </g>
</svg>